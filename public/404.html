<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Browserfit</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light dark; --bg: #fff; --text: #0a0a0b; --muted: #5b6170; --accent: #0961e2; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0b; --text: #f4f4f5; --muted: #a1a5b0; --accent: #61acfd; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; box-sizing: border-box; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, sans-serif; }
      main { max-width: 30rem; }
      h1 { margin: 0 0 0.5rem; font-size: 1.75rem; letter-spacing: -0.02em; }
      p { margin: 0 0 1rem; color: var(--muted); }
      a { color: var(--accent); }
    </style>
    <script>
      // Browserfit's pages live behind a "#" (for example /#/browser/firefox). Anyone who followed or typed the plain
      // path (/browser/firefox) is sent to the same page there; the app shows its own not-found page for unknown ones.
      (function () {
        var path = location.pathname.replace(/\/+$/, '');
        if (path && !/\.[a-z0-9]{1,8}$/i.test(path)) location.replace('/#' + path + location.search);
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>That page isn’t here</h1>
      <p>Browserfit’s pages have addresses like <code>/#/browser/firefox</code>. If a link brought you here, the page may have moved.</p>
      <p><a href="/">Go to the home page</a> or <a href="/#/browsers">browse all browsers</a>.</p>
    </main>
  </body>
</html>
